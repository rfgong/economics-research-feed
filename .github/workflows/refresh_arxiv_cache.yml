name: Refresh arXiv cache

on:
  schedule:
    # Multiple Monday opportunities before the 08:00 America/New_York ChatGPT feed.
    # 05:32, 07:32, 09:32, 11:32 UTC = 01:32–07:32 EDT / 00:32–06:32 EST.
    - cron: "32 5,7,9,11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-arxiv-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1

      - name: Check whether cache is already fresh
        id: freshness
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          state = Path("arxiv_recent_state.json")
          today_et = datetime.now(ZoneInfo("America/New_York")).date().isoformat()

          fresh = False
          if state.exists():
              try:
                  fresh = (
                      json.loads(state.read_text(encoding="utf-8"))
                      .get("refreshed_date_et") == today_et
                  )
              except (OSError, json.JSONDecodeError):
                  pass

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"skip={'true' if fresh else 'false'}\n")

          print(
              "Cache already fresh; skipping upstream fetch."
              if fresh else "Cache needs refresh."
          )
          PY

      - name: Fetch and build compact arXiv cache
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          API = "https://oaipmh.arxiv.org/oai"
          OUT = Path("arxiv_recent.jsonl")
          STATE = Path("arxiv_recent_state.json")

          TARGET_CATEGORIES = {
              "econ.EM", "econ.GN", "econ.TH",
              "stat.ME", "stat.AP", "q-fin.EC", "cs.GT",
          }
          TOP_LEVEL_SETS = ["econ", "stat", "q-fin", "cs"]

          OAI_NS = "http://www.openarchives.org/OAI/2.0/"
          RAW_NS = "http://arxiv.org/OAI/arXivRaw/"
          NS = {"oai": OAI_NS, "raw": RAW_NS}

          ET_TZ = ZoneInfo("America/New_York")
          now_et = datetime.now(ET_TZ)
          cutoff_date_et = now_et.date() - timedelta(days=14)

          # Harvest a slightly wider OAI update window, then enforce the exact
          # cache window using each paper's arXivRaw v1 date below.
          harvest_from = cutoff_date_et - timedelta(days=2)
          harvest_until = now_et.date()

          def clean(value):
              return " ".join((value or "").split())

          def fetch_xml(params):
              url = API + "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "rfgong/economics-research-feed "
                          "(noncommercial academic metadata harvest)"
                      ),
                      "Accept": "application/xml,text/xml;q=0.9,*/*;q=0.1",
                  },
              )

              error = None
              retry_delays = [30, 90, 180]

              for attempt in range(len(retry_delays) + 1):
                  try:
                      with urllib.request.urlopen(request, timeout=90) as response:
                          return response.read()
                  except Exception as exc:
                      error = exc
                      if attempt >= len(retry_delays):
                          break

                      delay = retry_delays[attempt]
                      if isinstance(exc, urllib.error.HTTPError):
                          retry_after = exc.headers.get("Retry-After")
                          if retry_after:
                              try:
                                  delay = max(delay, int(retry_after))
                              except ValueError:
                                  pass

                      print(
                          f"arXiv OAI fetch attempt {attempt + 1} failed: "
                          f"{exc}; retrying in {delay}s."
                      )
                      time.sleep(delay)

              raise RuntimeError(f"arXiv OAI-PMH fetch failed: {error}")

          def parse_v1_date(raw):
              versions = raw.findall("raw:version", NS)
              for version in versions:
                  if version.attrib.get("version") == "v1":
                      date_text = clean(version.findtext("raw:date", default="", namespaces=NS))
                      if not date_text:
                          return None
                      dt = parsedate_to_datetime(date_text)
                      if dt.tzinfo is None:
                          dt = dt.replace(tzinfo=timezone.utc)
                      return dt.astimezone(ET_TZ)
              return None

          def parse_record(record):
              header = record.find("oai:header", NS)
              if header is None or header.attrib.get("status") == "deleted":
                  return None

              raw = record.find("oai:metadata/raw:arXivRaw", NS)
              if raw is None:
                  return None

              arxiv_id = clean(raw.findtext("raw:id", default="", namespaces=NS))
              title = clean(raw.findtext("raw:title", default="", namespaces=NS))
              abstract = clean(raw.findtext("raw:abstract", default="", namespaces=NS))
              authors_text = clean(raw.findtext("raw:authors", default="", namespaces=NS))
              categories_text = clean(
                  raw.findtext("raw:categories", default="", namespaces=NS)
              )

              if not arxiv_id or not title or not abstract or not authors_text:
                  return None

              categories = categories_text.split()
              if not TARGET_CATEGORIES.intersection(categories):
                  return None

              v1_dt = parse_v1_date(raw)
              if v1_dt is None or v1_dt.date() < cutoff_date_et:
                  return None

              authors = [a.strip() for a in authors_text.split(",") if a.strip()]

              return {
                  "arxiv_id": arxiv_id,
                  "title": title,
                  "authors": authors,
                  "v1_submitted_at": (
                      v1_dt.astimezone(timezone.utc)
                      .replace(microsecond=0)
                      .isoformat()
                      .replace("+00:00", "Z")
                  ),
                  "v1_date_et": v1_dt.date().isoformat(),
                  "updated_at": "",
                  "primary_category": categories[0] if categories else "",
                  "categories": categories,
                  "url": f"https://arxiv.org/abs/{arxiv_id}",
                  "abstract": abstract,
              }

          rows_by_id = {}

          for set_spec in TOP_LEVEL_SETS:
              params = {
                  "verb": "ListRecords",
                  "metadataPrefix": "arXivRaw",
                  "set": set_spec,
                  "from": harvest_from.isoformat(),
                  "until": harvest_until.isoformat(),
              }

              while True:
                  root = ET.fromstring(fetch_xml(params))

                  error_node = root.find("oai:error", NS)
                  if error_node is not None:
                      code = error_node.attrib.get("code", "")
                      message = clean(error_node.text)
                      if code == "noRecordsMatch":
                          break
                      raise RuntimeError(
                          f"arXiv OAI-PMH error for set {set_spec}: "
                          f"{code}: {message}"
                      )

                  for record in root.findall(".//oai:record", NS):
                      row = parse_record(record)
                      if row is not None:
                          rows_by_id[row["arxiv_id"]] = row

                  token_node = root.find(
                      ".//oai:resumptionToken", NS
                  )
                  token = clean(token_node.text) if token_node is not None else ""
                  if not token:
                      break

                  # OAI-PMH resumption-token requests contain only verb + token.
                  time.sleep(5)
                  params = {
                      "verb": "ListRecords",
                      "resumptionToken": token,
                  }

              # Be polite between top-level archive sets.
              time.sleep(5)

          recent = list(rows_by_id.values())
          if not recent:
              raise RuntimeError(
                  "No matching arXiv records found in the recent OAI-PMH window."
              )

          recent.sort(
              key=lambda row: (row["v1_submitted_at"], row["arxiv_id"]),
              reverse=True,
          )

          latest_v1_date_et = max(row["v1_date_et"] for row in recent)

          # Fail safely rather than overwrite a good cache with obviously stale data.
          if (
              now_et.date()
              - datetime.strptime(latest_v1_date_et, "%Y-%m-%d").date()
          ).days > 10:
              raise RuntimeError(
                  f"Latest arXiv v1 date is unexpectedly old: {latest_v1_date_et}"
              )

          with OUT.open("w", encoding="utf-8") as f:
              for row in recent:
                  f.write(json.dumps(row, ensure_ascii=False) + "\n")

          state = {
              "source": API,
              "refreshed_date_et": now_et.date().isoformat(),
              "window_days": 14,
              "categories": sorted(TARGET_CATEGORIES),
              "recent_rows": len(recent),
              "latest_v1_date_et": latest_v1_date_et,
          }
          STATE.write_text(
              json.dumps(state, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(
              f"Cache ready: {len(recent)} arXiv records via OAI-PMH; "
              f"latest v1 date {latest_v1_date_et}."
          )
          PY

      - name: Commit cache if changed
        if: steps.freshness.outputs.skip != 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add arxiv_recent.jsonl arxiv_recent_state.json

          if git diff --cached --quiet; then
            echo "arXiv cache is already current."
            exit 0
          fi

          git commit -m "chore: refresh arXiv cache"
          git pull --rebase origin main
          git push origin HEAD:main
